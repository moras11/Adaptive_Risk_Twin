name: CI - Adaptive Risk Twin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1 — Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2 — Setup Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # Step 3 — Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4 — Lint check
    - name: Run Black lint
      run: |
        pip install black
        black --check .

    # Step 5 — Run tests
    - name: Run tests
      run: |
        pip install pytest
        pytest -q

    # Step 6 — Build Docker image
    - name: Build Docker image
      run: |
        docker build -t risk-twin-api .

    # Step 7 — Upload Docker Image Artifact (Optional)
    - name: Save Docker Image
      uses: actions/upload-artifact@v3
      with:
        name: risk-twin-api-image
        path: |
          /tmp
        retention-days: 3
